name: Trusted Data Lab - Pipeline Completo (Bronce, Cuarentena, Plata y Oro)

on:
  schedule:
    # Ingesta y procesamiento semanal: Cada lunes a las 06:00 UTC (00:00 hora de Colima)
    - cron: '0 6 * * 1'
  workflow_dispatch:
    # Permite la ejecución manual desde la consola de GitHub Actions

permissions:
  contents: write

jobs:
  run-pipeline-medallion:
    name: Ejecución Medallion (Bronce -> Cuarentena/Plata -> Oro)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del Repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Entorno de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar Dependencias de Ingeniería y Calidad
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: 1. Ejecutar Ingesta Capa Bronce (Raw Layer)
        run: |
          python src/extractor_bronce.py

      - name: 2. Ejecutar Pipeline de Integración, Calidad y Limpieza (Plata y Oro)
        run: |
          python src/pipeline_plata_oro.py

      - name: 3. Auditoría de Calidad e Integridad de Capas
        run: |
          echo "=== AUDITORÍA CAPA CUARENTENA ==="
          ls -lh data/cuarentena/
          echo "=== AUDITORÍA CAPA PLATA ==="
          ls -lh data/plata/
          echo "=== AUDITORÍA CAPA ORO ==="
          ls -lh data/oro/
          python -c "
          import pandas as pd, json
          df_plata = pd.read_csv('data/plata/datos_limpios.csv')
          df_oro = pd.read_csv('data/oro/dataset_analitico.csv')
          df_cuarentena = pd.read_csv('data/cuarentena/registros_invalidos.csv')
          assert len(df_plata) >= 36, 'Falla: Capa Plata debe contener al menos 36 periodos'
          assert len(df_oro) > 0, 'Falla: Capa Oro analítica vacía'
          assert 'motivo_rechazo' in df_cuarentena.columns, 'Falla: Cuarentena no documenta motivo_rechazo'
          print(f'Auditoría exitosa: {len(df_plata)} registros en Plata, {len(df_oro)} en Oro, {len(df_cuarentena)} en Cuarentena.')
          "

      - name: 4. Persistir Artefactos en el Repositorio (Git Auto-Commit)
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "No se detectaron modificaciones en las capas de datos."
          else
            git commit -m "chore(data-pipeline): actualización de capas Bronce, Cuarentena, Plata y Oro [skip ci]"
            git push origin main || git push
          fi
